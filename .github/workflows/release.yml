name: release-artifacts
on:
  release: {types: [published]}
permissions: {contents: write}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install -e '.[dev]'
      - run: make release
      - uses: softprops/action-gh-release@v2
        with: {files: 'dist/*'}
