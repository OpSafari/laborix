name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11','3.12','3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
      - run: python -m pip install -e '.[dev,torch]' --extra-index-url https://download.pytorch.org/whl/cpu
      - run: make build
      - run: make test-all
      - run: make format-check
      - run: make lint
